<title>MediGuía</title>
<style>
:root { --bg: #f3f6f8; --card: #ffffff; --text: #1b2733; --muted: #5f6c79; --border: #dfe5ea; --primary: #0f766e; --on-primary: #ffffff; --bad: #b42318; --bad-soft: #fdeceb; }
@media (prefers-color-scheme: dark) { :root { --bg: #0e1518; --card: #162126; --text: #e4ecef; --muted: #98a7b1; --border: #263740; --primary: #3cc9b6; --on-primary: #111111; --bad: #f58a80; --bad-soft: #3a1a18; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; }
main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 28px 22px; text-align: center; }
.mark { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: var(--primary); color: var(--on-primary); font-size: 1.8rem; font-weight: 800; }
h1 { margin: 12px 0 2px; font-size: 1.6rem; color: var(--primary); }
p { margin: 6px 0; }
.muted { color: var(--muted); font-size: 0.9rem; }
form { display: grid; gap: 12px; margin-top: 18px; text-align: left; }
label { font-weight: 600; font-size: 0.92rem; }
input[type=text] { width: 100%; margin-top: 6px; font: inherit; font-size: 1.15rem; letter-spacing: 2px; text-transform: uppercase; padding: 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); text-align: center; }
input[type=text]:focus { outline: none; border-color: var(--primary); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
button { font: inherit; font-weight: 700; font-size: 1.02rem; padding: 13px; border: 0; border-radius: 12px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
button[disabled] { opacity: 0.6; cursor: wait; }
.error { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 9px 12px; font-size: 0.9rem; }
.legal { margin-top: 18px; font-size: 0.76rem; color: var(--muted); }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✚</div>
  <h1>MediGuía</h1>
  <p class="muted">Demostración privada. Escribe la clave de acceso que te enviaron.</p>

    <label class="check"><input type="checkbox" id="remember" checked> Recordar en este dispositivo</label>
    <p class="error" id="err" hidden>Esa clave no es correcta. Revísala y vuelve a intentar.</p>
    <button type="submit" id="go">Entrar</button>
  </form>
  <p class="legal">© 2026 MediGuía · Contenido confidencial. Prohibida su copia o distribución sin autorización.</p>
</main>

const STORE = 'mediguia_acceso';
const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const normalize = (s) => s.toUpperCase().replace(/[^A-Z0-9]/g, '');

async function deriveKey(code) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
// La app reemplaza esta página solo cuando terminó de cargar; si no, se escribiría debajo del cuadro de la clave.
const loaded = new Promise((r) => (document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r) : r()));
async function openApp(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATA.iv) }, key, bytes(DATA.ct));
  const html = new TextDecoder().decode(plain);
  await loaded;
  document.open();
  document.write(html);
  document.close();
}
function saved() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } }
function save(v) { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch (e) {} }

(async () => {
  const s = saved();
  if (s && s.salt === DATA.salt) {
    const box = document.querySelector('main');
    box.hidden = true; // este dispositivo ya tiene la clave: no mostramos el cuadro mientras abre
    try {
      const key = await crypto.subtle.importKey('raw', bytes(s.key), 'AES-GCM', false, ['decrypt']);
      return await openApp(key);
    } catch (e) {
      save(null);
      box.hidden = false;
    }
  }
})();

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const go = document.getElementById('go');
  const err = document.getElementById('err');
  err.hidden = true;
  go.disabled = true;
  go.textContent = 'Abriendo…';
  try {
    const key = await deriveKey(normalize(document.getElementById('code').value));
    if (document.getElementById('remember').checked) save({ salt: DATA.salt, key: b64(await crypto.subtle.exportKey('raw', key)) });
    await openApp(key);
  } catch (e2) {
    err.hidden = false;
    go.disabled = false;
    go.textContent = 'Entrar';
  }
});
</script>
